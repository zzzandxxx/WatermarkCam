plugins {
    id 'com.android.application'
}

def ksFile = file("../keystore/huaming.jks")
def hasKs = ksFile.exists()

android {
    namespace 'com.huaming.watermark'
    compileSdk 35

    defaultConfig {
        applicationId "com.huaming.watermark"
        minSdk 24
        targetSdk 34
        versionCode 11
        versionName "1.8.0"
        resourceConfigurations += ["zh", "en"]
    }

    signingConfigs {
        release {
            if (hasKs) {
                storeFile ksFile
                storePassword "huaming2026"
                keyAlias "huaming"
                keyPassword "huaming2026"
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (hasKs) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packaging {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }
}

configurations.all {
    // Kotlin 1.8 起 stdlib-jdk7/jdk8 的类已并入 kotlin-stdlib，
    // CameraX 传递依赖会引入 1.6.x 的旧拆分包，导致 Duplicate class。
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    def camerax = "1.3.4"
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
}
